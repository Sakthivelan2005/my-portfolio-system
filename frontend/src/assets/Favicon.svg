<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- The Continuous "SS" Stack Gradient -->
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Cyan -->
      <stop offset="50%" stop-color="#22c55e" /> <!-- Neon Green -->
      <stop offset="100%" stop-color="#ffd670" /> <!-- Orange -->
    </linearGradient>

    <!-- THE FIX: Expanded Filter Bounds to allow infinite light bleed -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber-Hexagon -->
  <polygon points="64,8 116,36 116,92 64,120 12,92 12,36" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Grouping the SS to apply the glow uniformly -->
  <g filter="url(#glow)">
    <!-- Left "S" -->
    <path 
      d="M 52 38 L 36 38 C 28 38 24 43 24 50 C 24 57 28 62 36 62 L 44 62 C 52 62 56 67 56 74 C 56 81 52 86 44 86 L 28 86" 
      fill="none" 
      stroke="url(#s-grad)" 
      stroke-width="10" 
      stroke-linecap="round" 
    />
    <circle cx="52" cy="38" r="5" fill="#38bdf8" />
    <circle cx="28" cy="86" r="5" fill="#22c55e" />

    <!-- Right "S" -->
    <path 
      d="M 100 38 L 84 38 C 76 38 72 43 72 50 C 72 57 76 62 84 62 L 92 62 C 100 62 104 67 104 74 C 104 81 100 86 92 86 L 76 86" 
      fill="none" 
      stroke="url(#s-grad)" 
      stroke-width="10" 
      stroke-linecap="round" 
    />
    <circle cx="100" cy="38" r="5" fill="#22c55e" />
    <circle cx="76" cy="86" r="5" fill="#ffd670" />
  </g>
</svg>
